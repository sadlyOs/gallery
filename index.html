<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./src/js/script.js" defer></script>
    <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
    <div class="wrapper min-h-full">
        <header class="header w-full h-[100vh] text-white mb-[50px]  md:mb-[100px]">
            <div class="header__container h-full container mx-auto py-[30px]">
                <div class="header__top flex justify-between items-center">
                    <div class="header__left">
                        <a href="#"><img src="./src/img/space-ship.png" alt="space-ship" class="h-[8vh]"></a>
                    </div>
                    <div class="header__right">
                        <div class="header__menu">
                            <ul class="menu flex justify-between gap-[10px] md:gap-[40px] lg:text-2xl">
                                <li class="menu__item">Sign in</li>
                                <li class="menu__item">Log in</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="header__bottom text-center pt-[300px]">
                    <div class="header__main-text">
                        <div class="header__main-header pb-[20px]">
                            <h1 class="md:text-7xl text-5xl font-bold">Space Gallery</h1>
                        </div>
                        <div class="header__main-text">
                            <p class="text-xl">A virtual space inspired by the infinite beauty of the universe</p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="col1 pb-[200px]">
                <div class="col1__container container mx-auto text-white">
                    <div class="simple-text col__header pb-[50px] check-anime opacity-0">
                        <h2 class="text-black text-4xl md:text-6xl text-center font-bold">Gallery</h2>
                    </div>
                    <div class="col1__gallery gallery flex flex-col lg:flex-row">
                        <div class="gallery__item check-anime">
                            <img src="./src/img/galaktika.jpg" class="relative z-0" alt="galaktika">
                            <p>Galaktika</p>
                        </div>
                        <div class="gallery__item check-anime">
                            <img src="./src/img/missions.jpg" alt="">
                            <p>Missions</p>
                        </div>
                        <div class="gallery__item check-anime">
                            <img src="./src/img/earth.jpg" alt="">
                            <p>Earth and Space</p>
                        </div>
                        <div class="gallery__item check-anime">
                            <img src="./src/img/human.jpg" alt="">
                            <p>Human and Space</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
